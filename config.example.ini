[default]
bot_name = BABY
xdotool = xdotool
piper_binary = speech/piper/piper
piper_model = speech/piper/models/en_US-amy-medium.onnx
wake_word_model = wake_word/hey_baby.onnx
wakeword_engine = openwakeword

[connectors]
# Enable/disable external messaging bridges
whatsapp_enabled = true
whatsapp_port = 8765
whatsapp_webhook_port = 8766
# Comma-separated list of authorized phone numbers (E.164 format, e.g. 919876543210)
whatsapp_whitelist = 

[groq]
# Groq LPU API key for fast cloud fallback reasoning
api_key = YOUR_GROQ_API_KEY
model = llama-3.3-70b-versatile

[composio]
# Optional tool integration framework
api_key = YOUR_COMPOSIO_API_KEY

[google]
client_secret_file = credentials/google_client_secret.json
token_file = credentials/google_token.json
